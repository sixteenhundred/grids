<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grid.</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--accent:#0071e3}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#000;color:#f5f5f7;overflow:hidden}
#phone{max-width:430px;margin:0 auto;background:#000;position:relative;height:100vh;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:120px;padding-top:14px}
.navwrap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 0 24px;pointer-events:none;background:linear-gradient(180deg,transparent,#000 55%);z-index:40}
.nav{pointer-events:auto;display:flex;align-items:center;gap:3px;background:#1c1c1e;border:0.5px solid #333;border-radius:100px;padding:8px 9px;box-shadow:0 10px 34px rgba(0,0,0,0.7)}
.navbtn{position:relative;width:44px;height:44px;border:none;background:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#8e8e93;font-size:23px;transition:background .15s,color .15s}
.navbtn.on{background:#fff;color:#1c1c1e}
.navplus{width:48px;height:48px;border:none;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:26px;flex-shrink:0}
.badge{position:absolute;top:4px;right:5px;min-width:16px;height:16px;border-radius:100px;background:#ff3b30;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #1c1c1e}
.card{background:#1c1c1e;border-radius:22px;padding:18px;border:0.5px solid rgba(255,255,255,0.08)}
.btn{width:100%;border:none;border-radius:100px;padding:16px;font-size:15px;font-weight:600;cursor:pointer;color:#fff}
.btn-ghost{background:rgba(255,255,255,0.14);color:#fff}
.btn-dark{background:#2c2c2e;color:#fff}
.h{font-size:27px;font-weight:700;letter-spacing:-0.6px}
.sub{font-size:14px;color:#8e8e93;margin-top:6px;line-height:1.5}
.input{width:100%;border:none;background:#1c1c1e;border-radius:16px;padding:15px;font-size:15px;color:#f5f5f7;margin-bottom:11px;font-family:inherit}
.input::placeholder{color:#6e6e73}
.chip{display:inline-block;padding:8px 15px;border-radius:100px;font-size:13px;font-weight:500;background:#1c1c1e;color:#f5f5f7;cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.slider{-webkit-appearance:none;width:100%;height:6px;border-radius:100px;background:#3a3a3c;outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;cursor:pointer}
.fbox{border-radius:22px;padding:16px;border:none;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:96px;justify-content:space-between}
.fbox i{font-size:23px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:rgba(255,255,255,0.12)}
.fbox b{font-size:14px;font-weight:600}
.cc{background:#1c1c1e;border-radius:20px;overflow:hidden;cursor:pointer;border:0.5px solid rgba(255,255,255,0.08)}
.pic{background-size:cover;background-position:center;background-color:#2a2a2c}
.porttile{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;display:flex;align-items:flex-end;color:#fff;font-size:11px;font-weight:600;padding:8px;line-height:1.3;background-size:cover;background-position:center;background-color:#2a2a2c}
.porttile .lbl{position:relative;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,0.7)}
.porttile .scrim{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,0.6));z-index:1}
.modal-wrap{position:absolute;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:flex-end;z-index:50}
.modal-wrap.on{display:flex}
.sheet{background:#0a0a0a;width:100%;border-radius:28px 28px 0 0;max-height:90%;overflow-y:auto;padding:8px 22px 34px;position:relative;border-top:0.5px solid rgba(255,255,255,0.1)}
.grab{width:38px;height:5px;border-radius:100px;background:rgba(255,255,255,0.2);margin:10px auto 16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:0.5px solid rgba(255,255,255,0.08);font-size:14px}
.pkg{background:#1c1c1e;border-radius:18px;padding:16px;border:0.5px solid rgba(255,255,255,0.08);margin-bottom:11px;cursor:pointer}
.roleitem{display:flex;align-items:center;gap:12px;background:#1c1c1e;border-radius:16px;padding:13px 15px;margin-bottom:9px}
.prog{height:6px;border-radius:100px;background:#2c2c2e;overflow:hidden}
.prog>div{height:100%;background:var(--accent);border-radius:100px}
.av{border-radius:50%;background-size:cover;background-position:center;flex-shrink:0;background-color:#2a2a2c}
.seclabel{display:flex;justify-content:space-between;align-items:center;padding:6px 22px 12px}
.seclabel b{font-size:18px;font-weight:700}
.seclabel a{font-size:13px;color:var(--accent);cursor:pointer}
.notif{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:0.5px solid rgba(255,255,255,0.08)}
.notif .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 22px 6px}
.hscroll::-webkit-scrollbar{display:none}
.urgent{background:#3a1414;border:0.5px solid #5a1f1f}
.urgbadge{background:#ff3b30;color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:0.3px}
.stage{display:flex;align-items:center;gap:8px;margin-bottom:0}
.stagedot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.stageline{flex:1;height:2px;background:#2c2c2e}
.stageline.fill{background:#4fd07a}
.wheel{height:120px;overflow-y:scroll;scroll-snap-type:y mandatory;border-radius:16px;background:#1c1c1e;border:0.5px solid rgba(255,255,255,0.08);position:relative}
.wheel::-webkit-scrollbar{display:none}
.wheelitem{height:40px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:16px;color:#6e6e73}
.wheelitem.sel{color:#fff;font-weight:700;font-size:18px}
.stars{color:#f5a14f;font-size:13px}</style></head><body>

<div style="font-size:62px;font-weight:700;letter-spacing:-2px;color:#fff">Grid.</div>

<div style="font-size:40px;font-weight:700;letter-spacing:-1.5px;color:#fff">Grid.</div>
<div style="margin-top:auto;padding-bottom:30px"><h1 style="font-size:36px;font-weight:700;letter-spacing:-1px;line-height:1.1;color:#fff">Creatives,<br>on demand.</h1>
<p style="font-size:15px;color:rgba(255,255,255,0.85);margin-top:14px;line-height:1.5">Book verified photographers, videographers & drone pilots. Protected by Grid Escrow.</p></div>

 style="font-size:13px;font-weight:600;color:#8e8e93;margin:24px 0 12px">REVIEWS FROM CLIENTS</div>'+revs.map(function(r){return '<div class="pkg" style="cursor:default"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">'+r.by+'</b>'+stars(r.r)+'</div><p style="font-size:13px;color:#bbb;margin-top:7px;line-height:1.5">'+r.t+'</p></div>'}).join('')+'<div style="font-size:13px;font-weight:600;color:#8e8e93;margin:20px 0 12px">DASHBOARD</div><div class="grid2">'+fbox('ti-layout-kanban','Projects','Projects','projects()')+fbox('ti-file-text','Contracts','Contracts','contracts()')+'</div><button class="btn btn-dark" style="margin-top:18px">Edit profile</button><button class="btn" style="background:#3a1515;color:#f06a6a;margin-top:11px" onclick="logout()">Log out</button></div>';}

var pending=null;
function openUpload(){pending=null;openSheet('<h2 style="font-size:20px;font-weight:700">Add to portfolio</h2><p class="sub" style="margin-bottom:20px">Upload a real image or video from your device.</p><div id="upDrop" onclick="pickFile()" style="border:2px dashed rgba(90,169,245,0.4);border-radius:20px;padding:34px 20px;text-align:center;color:#5aa9f5;margin-bottom:16px;cursor:pointer;background:#11151c"><i class="ti ti-cloud-upload" style="font-size:40px"></i><p style="font-size:14px;margin-top:12px;font-weight:600">Tap to choose photo or video</p></div><div id="upPreview"></div><input class="input" id="upTitle" placeholder="Project title"><button class="btn" id="upBtn" style="background:#2c2c2e" disabled onclick="addMedia()">Add to portfolio</button>',true);}
function pickFile(){var input=document.getElementById('fileInput');input.value='';input.onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var isV=f.type.indexOf('video')===0;var r=new FileReader();r.onload=function(ev){pending={url:ev.target.result,video:isV,name:f.name};var pv=document.getElementById('upPreview');if(pv)pv.innerHTML='<div style="border-radius:16px;overflow:hidden;margin-bottom:16px">'+(isV?'<video src="'+ev.target.result+'" style="width:100%;max-height:220px;object-fit:cover" muted playsinline></video>':'<img src="'+ev.target.result+'" style="width:100%;max-height:240px;object-fit:cover">')+'</div>';var dd=document.getElementById('upDrop');if(dd)dd.innerHTML='<i class="ti ti-check" style="font-size:32px"></i><p style="font-size:14px;margin-top:8px;font-weight:600">'+f.name+'</p>';var ti=document.getElementById('upTitle');if(ti&&!ti.value)ti.value=f.name.replace(/\.[^.]+$/,'');var bt=document.getElementById('upBtn');if(bt){bt.disabled=false;bt.style.background='#0071e3';}};r.readAsDataURL(f);};input.click();}
function addMedia(){var t=(document.getElementById('upTitle').value||'New Project').trim();var tile=pending&&pending.url?{url:pending.url,video:pending.video,t:t}:{c:'#2a3a52',t:t};if(!johnPort)johnPort=find('john').portfolio.slice();johnPort.unshift(tile);closeSheet();goTab('creator','c-profile');setTimeout(function(){var el=document.getElementById('johnPort');if(el)el.innerHTML=johnPort.map(portTile).join('');},60);}

function academy(){openSheet('<h2 style="font-size:22px;font-weight:700">Academy</h2><p class="sub" style="margin-bottom:18px">Courses to sharpen your craft.</p>'+COURSES.map(function(co,i){var pct=Math.round(co.done/co.lessons.length*100);return '<div class="pkg" onclick="course('+i+')" style="padding:0;overflow:hidden"><div class="pic" style="height:110px;background-image:url('+co.cover+')"></div><div style="padding:14px"><b style="font-size:15px">'+co.t+'</b><div style="font-size:12px;color:#8e8e93;margin:3px 0 0">'+co.by+' \u00b7 '+co.dur+'</div><div class="prog" style="margin-top:12px"><div style="width:'+pct+'%"></div></div><div style="font-size:11px;color:#8e8e93;margin-top:6px">'+co.done+' / '+co.lessons.length+' lessons \u00b7 '+pct+'%</div></div></div>'}).join(''),true);}
function course(i){var co=COURSES[i];openSheet('<button onclick="academy()" style="border:none;background:none;color:#5aa9f5;font-size:14px;padding:0 0 12px;cursor:pointer"><i class="ti ti-chevron-left"></i> Academy</button><div class="pic" style="height:130px;border-radius:18px;background-image:url('+co.cover+');margin-bottom:14px"></div><h2 style="font-size:21px;font-weight:700">'+co.t+'</h2><p class="sub" style="margin-bottom:18px">'+co.by+' \u00b7 '+co.dur+'</p>'+co.lessons.map(function(l,li){var done=li<co.done;return '<div class="roleitem" onclick="lesson('+i+','+li+')" style="cursor:pointer"><div style="width:34px;height:34px;border-radius:50%;background:'+(done?'#13301f':'#2c2c2e')+';color:'+(done?'#4fd07a':'#8e8e93')+';display:flex;align-items:center;justify-content:center"><i class="ti '+(done?'ti-check':'ti-player-play')+'"></i></div><div style="flex:1"><div style="font-size:14px;font-weight:500">'+l+'</div><div style="font-size:11px;color:#8e8e93">Lesson '+(li+1)+'</div></div></div>'}).join('')+'<button class="btn" style="background:#0071e3;margin-top:12px" onclick="continueCourse('+i+')">'+(co.done>=co.lessons.length?'Completed \u2713':'Continue learning')+'</button>',true);}
function lesson(i,li){var co=COURSES[i];if(li<=co.done&&co.done<co.lessons.length)co.done=li+1;openSheet('<div style="text-align:center;padding:20px 0"><div class="pic" style="height:160px;border-radius:18px;background-image:url('+co.cover+');display:flex;align-items:center;justify-content:center;margin-bottom:18px"><i class="ti ti-player-play" style="font-size:48px;color:#fff;text-shadow:0 2px 12px #000"></i></div><h2 style="font-size:19px;font-weight:700">'+co.lessons[li]+'</h2><p class="sub" style="margin-bottom:20px">Lesson '+(li+1)+' of '+co.lessons.length+'</p><button class="btn" style="background:#0071e3" onclick="course('+i+')">Mark done & back</button></div>',true);}
function continueCourse(i){var co=COURSES[i];if(co.done<co.lessons.length)lesson(i,co.done);else course(i);}
function shop(){openSheet('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h2 style="font-size:22px;font-weight:700">Shop</h2><button onclick="addProduct()" style="border:none;background:#13302a;color:#4fd0b0;border-radius:100px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer"><i class="ti ti-plus" style="vertical-align:-2px"></i> Add product</button></div><p class="sub" style="margin-bottom:18px">Sell presets, LUTs and templates.</p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px">'+SHOP.map(function(s){return '<div style="background:#1c1c1e;border-radius:18px;overflow:hidden"><div class="pic" style="height:100px;background-image:url('+(s.img||'')+');display:flex;align-items:flex-start;padding:10px"><span style="font-size:10px;font-weight:600;background:rgba(0,0,0,0.5);padding:3px 8px;border-radius:100px">'+s.type+'</span></div><div style="padding:12px"><div style="font-size:13px;font-weight:600;line-height:1.3">'+s.t+'</div><div style="font-size:14px;font-weight:700;color:#4fd0b0;margin-top:6px">$'+s.p+'</div></div></div>'}).join('')+'</div>',true);}
function addProduct(){openSheet('<button onclick="shop()" style="border:none;background:none;color:#4fd0b0;font-size:14px;padding:0 0 12px;cursor:pointer"><i class="ti ti-chevron-left"></i> Shop</button><h2 style="font-size:21px;font-weight:700">Add product</h2><div id="prodDrop" onclick="pickImg(\'prod\')" style="border:2px dashed rgba(79,208,176,0.4);border-radius:18px;padding:26px;text-align:center;color:#4fd0b0;margin:14px 0;cursor:pointer;background:#0e1a17"><i class="ti ti-photo" style="font-size:32px"></i><p style="font-size:13px;margin-top:8px;font-weight:600">Add cover image</p></div><div id="prodPrev"></div><input class="input" id="prodName" placeholder="Product name"><input class="input" id="prodPrice" placeholder="Price (USD)" type="number"><div style="display:flex;gap:8px;margin-bottom:16px" id="prodType">'+['LUT','Preset','Template'].map(function(t,i){return '<button onclick="pickType(this,\''+t+'\')" class="chip" style="flex:1;'+(i===0?'background:#13302a;color:#4fd0b0':'')+'">'+t+'</button>'}).join('')+'</div><button class="btn" style="background:#0071e3" onclick="saveProduct()">List product</button>',true);window.__pt='LUT';window.__img=null;}
function pickType(el,t){document.querySelectorAll('#prodType .chip').forEach(function(b){b.style.background='';b.style.color='';});el.style.background='#13302a';el.style.color='#4fd0b0';window.__pt=t;}
function saveProduct(){var n=(document.getElementById('prodName').value||'Untitled').trim();var p=parseInt(document.getElementById('prodPrice').value)||19;SHOP.unshift({t:n,p:p,type:window.__pt||'LUT',img:window.__img||HOUSES[1].url});shop();}
function pickImg(kind){var input=document.getElementById('fileInput');input.value='';input.onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){window.__img=ev.target.result;var pv=document.getElementById(kind+'Prev');if(pv)pv.innerHTML='<div style="border-radius:14px;overflow:hidden;margin-bottom:14px"><img src="'+ev.target.result+'" style="width:100%;max-height:170px;object-fit:cover"></div>';var dd=document.getElementById(kind+'Drop');if(dd)dd.innerHTML='<i class="ti ti-check" style="font-size:30px"></i><p style="font-size:13px;margin-top:6px;font-weight:600">Image added</p>';};r.readAsDataURL(f);};input.click();}
function collab(){var total=crew.reduce(function(a,c){return a+c.pay},0);var share=Math.max(0,100-total);openSheet('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><h2 style="font-size:22px;font-weight:700">Collab</h2><button onclick="addRole()" style="border:none;background:#3a1a28;color:#f07da0;border-radius:100px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer"><i class="ti ti-plus" style="vertical-align:-2px"></i> Add crew</button></div><p class="sub" style="margin-bottom:16px">Build a production team \u2014 named roles, no accounts.</p><div class="card" style="margin-bottom:16px;background:#11151c"><div style="font-size:12px;font-weight:600;color:#5aa9f5;margin-bottom:4px">PROJECT</div><b style="font-size:16px">Bel Air Listing Film</b></div><div id="crewList">'+crewList()+'</div><div class="card" style="margin-top:8px"><div class="row" style="padding-top:0"><span style="color:#8e8e93">You (lead)</span><b style="color:#4fd07a">'+share+'%</b></div><div class="row" style="border-bottom:none"><span style="font-weight:700">Crew total</span><b>'+total+'%</b></div></div></div>',true);}
function crewList(){return crew.map(function(m,i){return '<div class="roleitem"><div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#3a1a28,#5a2a3a);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#f07da0">'+m.name.split(' ').map(function(w){return w[0]}).join('')+'</div><div style="flex:1"><div style="font-size:14px;font-weight:600">'+m.name+'</div><div style="font-size:12px;color:#8e8e93">'+m.role+'</div></div><div style="text-align:right"><div style="font-size:14px;font-weight:700;color:#f07da0">'+m.pay+'%</div><button onclick="removeCrew('+i+')" style="border:none;background:none;color:#6e6e73;cursor:pointer"><i class="ti ti-x"></i></button></div></div>'}).join('')||'<p style="color:#8e8e93;font-size:13px;text-align:center;padding:16px">No crew yet.</p>';}
function removeCrew(i){crew.splice(i,1);collab();}
function addRole(){openSheet('<button onclick="collab()" style="border:none;background:none;color:#f07da0;font-size:14px;padding:0 0 12px;cursor:pointer"><i class="ti ti-chevron-left"></i> Collab</button><h2 style="font-size:21px;font-weight:700">Add crew member</h2><input class="input" id="crewName" placeholder="Name" style="margin-top:14px"><div style="font-size:12px;font-weight:600;color:#8e8e93;margin:6px 0 10px">ROLE</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px" id="roleChips">'+ROLES.map(function(r,i){return '<button onclick="pickRole(this,\''+r+'\')" class="chip" style="'+(i===0?'background:#3a1a28;color:#f07da0':'')+'">'+r+'</button>'}).join('')+'</div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:13px;color:#8e8e93">Pay share</span><span style="font-size:16px;font-weight:700;color:#f07da0" id="payVal">15%</span></div><input type="range" class="slider" min="5" max="40" step="5" value="15" oninput="document.getElementById(\'payVal\').textContent=this.value+\'%\'" id="paySlider" style="margin-bottom:18px"><button class="btn" style="background:#0071e3" onclick="saveCrew()">Add to crew</button>',true);window.__role='Co-Director';}
function pickRole(el,r){document.querySelectorAll('#roleChips .chip').forEach(function(b){b.style.background='';b.style.color='';});el.style.background='#3a1a28';el.style.color='#f07da0';window.__role=r;}
function saveCrew(){var n=(document.getElementById('crewName').value||'New Member').trim();var pay=parseInt(document.getElementById('paySlider').value)||15;crew.push({role:window.__role||'Co-Director',name:n,pay:pay});collab();}

function jobBoard(){var urg=[],reg=[];JOBS.forEach(function(j,i){(j.urgent?urg:reg).push(i);});var h='<h2 style="font-size:22px;font-weight:700">Job Board</h2><p class="sub" style="margin-bottom:18px">Open jobs posted by clients.</p>';if(urg.length){h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><span class="urgbadge">URGENT</span><span style="font-size:13px;font-weight:600;color:#ff5a5a">Last-minute jobs near you</span></div>'+urg.map(function(i){return jobCard(JOBS[i],i)}).join('')+'<div style="height:8px"></div>';}h+='<div style="font-size:13px;font-weight:600;color:#8e8e93;margin-bottom:12px">All jobs</div>'+reg.map(function(i){return jobCard(JOBS[i],i)}).join('');openSheet(h,true);}
function viewJob(i){var j=JOBS[i];openSheet('<button onclick="jobBoard()" style="border:none;background:none;color:#4fb9e0;font-size:14px;padding:0 0 12px;cursor:pointer"><i class="ti ti-chevron-left"></i> Job Board</button><div class="pic" style="height:170px;border-radius:18px;background-image:url('+j.img+');margin-bottom:16px"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="display:flex;gap:6px">'+(j.urgent?'<span class="urgbadge">URGENT</span>':'<span class="chip" style="background:#13283a;color:#4fb9e0">'+j.cat+'</span>')+(j.term&&j.term!=='One-off'?'<span class="chip" style="background:#241a3a;color:#b97fe0">'+j.term+'</span>':'')+'</div><span style="font-size:18px;font-weight:700;color:#4fd07a">$'+j.budget.toLocaleString()+'</span></div><h2 style="font-size:20px;font-weight:700;line-height:1.25">'+j.title+'</h2><div style="font-size:13px;color:#8e8e93;margin:8px 0 16px"><i class="ti ti-building"></i> '+j.company+' \u00b7 <i class="ti ti-map-pin"></i> '+j.loc+'</div><p style="font-size:14px;line-height:1.6;color:#bbb;margin-bottom:20px">'+j.desc+'</p>'+(j.cid?'<button class="btn btn-dark" style="margin-bottom:11px" onclick="company(\''+j.cid+'\')">View company profile</button>':'')+'<button class="btn" style="background:#0071e3" onclick="alert(\'Application sent!\')">Apply for this job</button>',true);}
var WHEEL=['One-off','1 week','2 weeks','1 month','2 months','3 months','6 months','9 months','12 months'];
function postJobSheet(){openSheet('<h2 style="font-size:22px;font-weight:700">Post a job</h2><p class="sub" style="margin-bottom:18px">Appears in the marketplace for creators.</p><div id="jobDrop" onclick="pickImg(\'job\')" style="border:2px dashed rgba(79,208,122,0.4);border-radius:18px;padding:26px;text-align:center;color:#4fd07a;margin-bottom:14px;cursor:pointer;background:#0e1a13"><i class="ti ti-photo" style="font-size:32px"></i><p style="font-size:13px;margin-top:8px;font-weight:600">Add reference image</p></div><div id="jobPrev"></div><input class="input" id="jobTitle" placeholder="Job title"><input class="input" id="jobLoc" placeholder="Location"><input class="input" id="jobBudget" placeholder="Budget (USD)" type="number"><textarea class="input" id="jobDesc" placeholder="Describe the work" style="min-height:70px;resize:none"></textarea><div style="display:flex;gap:8px;margin-bottom:14px" id="jobCat">'+['Photo','Video','Drone'].map(function(t,i){return '<button onclick="pickJobCat(this,\''+t+'\')" class="chip" style="flex:1;'+(i===0?'background:#13301f;color:#4fd07a':'')+'">'+t+'</button>'}).join('')+'</div><div onclick="toggleUrgent(this)" id="urgToggle" style="display:flex;justify-content:space-between;align-items:center;background:#1c1c1e;border-radius:14px;padding:14px 16px;margin-bottom:14px;cursor:pointer"><div style="display:flex;align-items:center;gap:10px"><i class="ti ti-alert-triangle" style="color:#ff5a5a;font-size:19px"></i><div><div style="font-size:14px;font-weight:600">Mark as urgent</div><div style="font-size:11px;color:#8e8e93">Pushes to Radar + Urgent feed</div></div></div><div id="urgSwitch" style="width:44px;height:26px;border-radius:100px;background:#3a3a3c;position:relative;transition:.2s"><div style="width:22px;height:22px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:.2s"></div></div></div><div style="font-size:12px;font-weight:600;color:#8e8e93;margin-bottom:8px">ENGAGEMENT LENGTH</div><div style="position:relative"><div style="position:absolute;left:0;right:0;top:40px;height:40px;border-top:0.5px solid rgba(255,255,255,0.1);border-bottom:0.5px solid rgba(255,255,255,0.1);pointer-events:none;z-index:1"></div><div class="wheel" id="termWheel" onscroll="wheelSnap()">'+WHEEL.map(function(w){return '<div class="wheelitem" data-w="'+w+'">'+w+'</div>'}).join('')+'</div></div><button class="btn" style="background:#1a9e4a;margin-top:16px" onclick="saveJob()">Post job</button>',true);window.__jc='Photo';window.__img=null;window.__urgent=false;window.__term='One-off';setTimeout(function(){var w=document.getElementById('termWheel');if(w){w.scrollTop=0;wheelSnap();}},80);}

function toggleUrgent(el){window.__urgent=!window.__urgent;var sw=document.getElementById('urgSwitch');var knob=sw.firstElementChild;if(window.__urgent){sw.style.background='#ff3b30';knob.style.left='20px';}else{sw.style.background='#3a3a3c';knob.style.left='2px';}}

function aistudio(){openSheet('<h2 style="font-size:22px;font-weight:700">AI Studio</h2><p class="sub" style="margin-bottom:18px">Generate the boring parts.</p><div class="grid2">'+[['ti-list-check','Shot list'],['ti-file-text','Script'],['ti-layout-board','Mood board'],['ti-mail','Proposal']].map(function(a){return '<button class="fbox" style="background:#241a3a;color:#9a7fe0" onclick="alert(\''+a[1]+' \u2014 coming next.\')"><i class="ti '+a[0]+'" style="color:#9a7fe0"></i><b>'+a[1]+'</b></button>'}).join('')+'</div>',true);}

function company(cid){var co=COMPANIES[cid];if(!co)return;openSheet('<div style="height:90px;border-radius:18px;background:linear-gradient(135deg,#0f7a3a,#1a9e4a);margin-bottom:14px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700">'+co.name.charAt(0)+'</div><div style="display:flex;align-items:center;gap:6px"><h2 style="font-size:21px;font-weight:700">'+co.name+'</h2><i class="ti ti-rosette-discount-check" style="color:#1a9e4a;font-size:19px"></i></div><p class="sub">'+co.ind+'</p><div class="grid2" style="margin:16px 0">'+metric('Rating',co.rating+' \u2605','#f5a14f')+metric('Jobs posted',co.jobs+'')+'</div><div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:12px;background:'+(co.paysOnTime?'#11241a':'#241a11')+'"><i class="ti '+(co.paysOnTime?'ti-circle-check':'ti-clock-exclamation')+'" style="font-size:24px;color:'+(co.paysOnTime?'#4fd07a':'#f5a14f')+'"></i><div><b style="font-size:14px;color:'+(co.paysOnTime?'#4fd07a':'#f5a14f')+'">'+(co.paysOnTime?'Pays on time':'Occasional delays')+'</b><div style="font-size:12px;color:#8e8e93">Based on escrow release history</div></div></div><div style="font-size:13px;font-weight:600;color:#8e8e93;margin-bottom:10px">LOCATIONS</div>'+co.locs.map(function(l){return '<div class="roleitem" style="margin-bottom:8px"><i class="ti ti-map-pin" style="color:#5aa9f5;font-size:18px"></i><span style="font-size:14px">'+l+'</span></div>'}).join('')+'<div style="font-size:13px;font-weight:600;color:#8e8e93;margin:18px 0 10px">REVIEWS FROM CREATORS</div>'+co.reviews.map(function(r){return '<div class="pkg" style="cursor:default"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">'+r.by+'</b>'+stars(r.r)+'</div><p style="font-size:13px;color:#bbb;margin-top:7px;line-height:1.5">'+r.t+'</p></div>'}).join(''),true);}

function profileFull(c){var revs=creatorReviews[c.id]||[];return '<div style="height:120px;background:linear-gradient(135deg,#1a2538,#0a0a0a)"></div><div style="padding:0 22px 24px;margin-top:-46px"><div class="av" style="width:90px;height:90px;border:4px solid #000;background-image:url('+AV[c.id]+')"></div><div style="display:flex;align-items:center;gap:6px;margin-top:12px"><h1 class="h">'+c.name+'</h1>'+(c.verified?'<i class="ti ti-rosette-discount-check" style="color:#0071e3;font-size:22px"></i>':'')+'</div><p class="sub">'+c.type+' \u00b7 '+c.city+'</p><div class="grid2" style="margin:16px 0">'+metric('Day rate','$'+c.rate.toLocaleString(),'#5aa9f5')+metric('Rating',c.rating+' \u2605')+'</div><p style="font-size:14px;line-height:1.6;color:#bbb">'+c.bio+'</p><div style="font-size:13px;font-weight:600;color:#8e8e93;margin:22px 0 12px">PORTFOLIO</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">'+c.portfolio.map(portTile).join('')+'</div><div style="font-size:13px;font-weight:600;color:#8e8e93;margin:24px 0 12px">PACKAGES</div>'+c.packages.map(function(p){return '<div class="pkg" onclick="book(\''+c.id+'\','+p.p+',\''+p.n+'\')"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:15px;font-weight:700">'+p.n+'</b><span style="font-size:15px;font-weight:700;color:#5aa9f5">$'+p.p.toLocaleString()+'</span></div><p style="font-size:12px;color:#8e8e93;margin:6px 0 0;line-height:1.4">'+p.d+'</p></div>'}).join('')+(revs.length?'<div style="font-size:13px;font-weight:600;color:#8e8e93;margin:24px 0 12px">REVIEWS FROM CLIENTS</div>'+revs.map(function(r){return '<div class="pkg" style="cursor:default"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">'+r.by+'</b>'+stars(r.r)+'</div><p style="font-size:13px;color:#bbb;margin-top:7px;line-height:1.5">'+r.t+'</p></div>'}).join(''):'')+'<button class="btn" style="background:var(--accent);margin-top:8px" onclick="book(\''+c.id+'\','+c.rate+',\'Day rate\')">Book '+c.name.split(' ')[0]+'</button>'+(session.role==='creative'?'<button class="btn btn-dark" style="margin-top:11px" onclick="reviewCreator(\''+c.id+'\')">Leave a review</button>':'')+'</div>';}

function book(id,price,pkg){var c=find(id);openSheet('<h2 style="font-size:20px;font-weight:700">Book '+c.name+'</h2><p class="sub" style="margin-bottom:18px">'+pkg+' \u00b7 $'+price.toLocaleString()+'</p><input class="input" placeholder="Project name"><input class="input" placeholder="Shoot date" onfocus="this.type=\'date\'"><div class="card" style="margin:6px 0 16px;background:#13301f"><div style="display:flex;gap:10px;align-items:flex-start"><i class="ti ti-shield-check" style="color:#4fd07a;font-size:20px"></i><div style="font-size:12px;color:#9fe0b8;line-height:1.5"><b>Grid Escrow protects this booking.</b> $'+price.toLocaleString()+' held, released on delivery approval.</div></div></div><button class="btn" style="background:#0071e3" onclick="contract2(\''+id+'\','+price+',\''+pkg+'\')">Continue to contract</button>',true);}
function contract2(id,price,pkg){var c=find(id);var fee=Math.round(price*0.1);openSheet('<h2 style="font-size:20px;font-weight:700">Digital contract</h2><p class="sub" style="margin-bottom:18px">Binding \u00b7 both parties sign on Grid.</p><div class="card" style="margin-bottom:16px"><div class="row" style="padding-top:0"><span style="color:#8e8e93">Creative</span><b>'+c.name+'</b></div><div class="row"><span style="color:#8e8e93">Package</span><b>'+pkg+'</b></div><div class="row"><span style="color:#8e8e93">Subtotal</span><b>$'+price.toLocaleString()+'</b></div><div class="row"><span style="color:#8e8e93">Grid fee (10%)</span><b>$'+fee.toLocaleString()+'</b></div><div class="row" style="border-bottom:none"><span style="font-weight:700">Total in escrow</span><b style="color:#4fd07a;font-size:16px">$'+(price+fee).toLocaleString()+'</b></div></div><button class="btn" style="background:#1a9e4a" onclick="sign(\''+c.name+'\','+(price+fee)+')"><i class="ti ti-signature" style="vertical-align:-2px"></i> Sign & fund escrow</button>',true);}
function sign(name,total){openSheet('<div style="text-align:center;padding:30px 10px"><div style="width:72px;height:72px;border-radius:50%;background:#13301f;display:flex;align-items:center;justify-content:center;margin:0 auto 18px"><i class="ti ti-check" style="font-size:38px;color:#4fd07a"></i></div><h2 style="font-size:22px;font-weight:700;margin-bottom:8px">Contract signed</h2><p class="sub" style="max-width:260px;margin:0 auto">$'+total.toLocaleString()+' held in Grid Escrow. '+name+' notified. Added to your Contracts & Projects.</p><button class="btn" style="background:#0071e3;margin-top:24px" onclick="closeSheet()">Done</button></div>');}

else if(view==='cl-jobs'){h='<div style="padding:18px 22px 10px"><div style="display:flex;justify-content:space-between;align-items:center"><h1 class="h">My jobs</h1><button onclick="postJobSheet()" style="border:none;background:#13301f;color:#4fd07a;border-radius:100px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer"><i class="ti ti-plus" style="vertical-align:-2px"></i> Post</button></div><p class="sub">Jobs you\'ve posted.</p></div><div style="padding:0 22px 24px">'+JOBS.map(jobCard).join('')+'</div>';}
else if(view==='cl-profile'){var co=COMPANIES.northwind;h='<div style="background:linear-gradient(180deg,#0f7a3a,#1a9e4a);height:110px;border-radius:0 0 28px 28px;margin-top:14px"></div><div style="padding:0 22px 24px;margin-top:-40px"><div style="width:78px;height:78px;border-radius:22px;background:#fff;border:4px solid #000;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#1a9e4a">'+co.name.charAt(0)+'</div><div style="display:flex;align-items:center;gap:6px;margin-top:12px"><h1 class="h">'+co.name+'</h1><i class="ti ti-rosette-discount-check" style="color:#1a9e4a;font-size:20px"></i></div><p class="sub">'+co.ind+'</p><div class="grid2" style="margin:16px 0">'+metric('Rating',co.rating+' \u2605','#f5a14f')+metric('Jobs posted',co.jobs+'')+'</div><div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:12px;background:#11241a"><i class="ti ti-circle-check" style="font-size:24px;color:#4fd07a"></i><div><b style="font-size:14px;color:#4fd07a">Pays on time</b><div style="font-size:12px;color:#8e8e93">Based on escrow release history</div></div></div><div style="font-size:13px;font-weight:600;color:#8e8e93;margin-bottom:10px">LOCATIONS</div>'+co.locs.map(function(l){return '<div class="roleitem" style="margin-bottom:8px"><i class="ti ti-map-pin" style="color:#5aa9f5;font-size:18px"></i><span style="font-size:14px">'+l+'</span></div>'}).join('')+'<div style="font-size:13px;font-weight:600;color:#8e8e93;margin:18px 0 10px">REVIEWS FROM CREATORS</div>'+co.reviews.map(function(r){return '<div class="pkg" style="cursor:default"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">'+r.by+'</b>'+stars(r.r)+'</div><p style="font-size:13px;color:#bbb;margin-top:7px;line-height:1.5">'+r.t+'</p></div>'}).join('')+'<div style="font-size:13px;font-weight:600;color:#8e8e93;margin:22px 0 12px">DASHBOARD</div><div class="grid2" style="margin-bottom:12px">'+metric('In escrow','$9,500','#4fd07a')+metric('Total spent','$24,800')+'</div><div class="grid2">'+fbox('ti-layout-kanban','Projects','Projects','projects()')+fbox('ti-file-text','Contracts','Contracts','contracts()')+fbox('ti-briefcase','My Jobs','JobBoard','goTab(\'client\',\'cl-jobs\')')+fbox('ti-wallet','Finance','Finance','finance()')+'</div><button class="btn btn-dark" style="margin-top:18px">Edit company profile</button><button class="btn" style="background:#3a1515;color:#f06a6a;margin-top:11px" onclick="logout()">Log out</button></div>';}
b.innerHTML=h;b.scrollTop=0;}
function filterCl(cat,el){document.querySelectorAll('#client-body .chip').forEach(function(c){c.style.background='';c.style.color='';});el.style.background='#1a9e4a';el.style.color='#fff';document.getElementById('browseList').innerHTML=(cat==='All'?CREATIVES:CREATIVES.filter(function(c){return c.cat===cat})).map(creativeCard).join('');}

function openSheet(html,close){var s=document.getElementById('sheet');s.innerHTML='<div class="grab"></div>'+(close?'<button onclick="closeSheet()" style="position:absolute;top:14px;right:18px;border:none;background:rgba(255,255,255,0.1);width:32px;height:32px;border-radius:50%;cursor:pointer;color:#fff;z-index:5"><i class="ti ti-x"></i></button>':'')+html;document.getElementById('modal').classList.add('on');s.scrollTop=0;}
function closeSheet(){document.getElementById('modal').classList.remove('on');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeSheet();});
function logout(){session={role:null,name:'',company:''};document.documentElement.style.setProperty('--accent','#0071e3');closeSheet();go('s-entry');}
setTimeout(function(){var sp=document.getElementById('s-splash');if(sp&&sp.classList.contains('on'))go('s-entry');},1700);
